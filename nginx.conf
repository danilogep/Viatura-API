server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA: qualquer rota do React Router cai no index.html, senão um F5 em
    # /viaturas devolveria 404 do nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|jpg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
