[pytest]
asyncio_mode = auto
# Sem isto, `pytest` (o script) nao enxerga contrib/, main.py e os modulos do
# projeto: so `python -m pytest` insere o diretorio atual no sys.path. Na minha
# maquina eu rodava com -m e passava; o CI roda o script e quebrava no import
# do conftest, com exit code 4.
pythonpath = .
testpaths = tests
addopts = -q
