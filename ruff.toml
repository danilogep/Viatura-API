line-length = 100
exclude = ["venv", ".venv", "alembic/versions"]

[lint]
select = ["E", "F", "I", "UP", "B", "C4"]
# B008: Depends(...)/Query(...) em default de parâmetro é o idioma do FastAPI.
# E501: o limite de coluna é verificado pelo formatter, não pelo linter.
ignore = ["B008", "E501"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"main.py" = ["F401"]
"alembic/env.py" = ["E402", "F401"]
