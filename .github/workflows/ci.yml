name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Lint, tipos e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Checagem de tipos
        # tsc --noEmit: o build já roda `tsc -b`, mas falhar aqui dá o erro de
        # tipo isolado, sem o ruído do bundle.
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build de produção
        run: npm run build

  imagem:
    name: Build da imagem Docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t viatura-frontend:ci .
