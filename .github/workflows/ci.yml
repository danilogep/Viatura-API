name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: Lint e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest com cobertura
        # A suíte roda contra SQLite em memória: não há serviço de banco a subir.
        run: |
          set -o pipefail
          pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=85             2>&1 | tee pytest.log

      - name: Resumo da execução
        # Vai para o resumo do job, que fica visivel sem abrir o log inteiro —
        # e e o unico lugar que a API do GitHub expoe sem autenticacao.
        if: always()
        run: |
          {
            echo '### Pytest'
            echo '```'
            tail -n 60 pytest.log 2>/dev/null || echo 'pytest nao chegou a escrever saida'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: |
            coverage.xml
            pytest.log
          if-no-files-found: warn

  imagem:
    name: Build da imagem Docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t viatura-api:ci .
