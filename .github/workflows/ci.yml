name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check .
      - name: Pytest com cobertura
        run: |
          set -o pipefail
          python -m pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=85 2>&1 | tee pytest.log
      - name: Resumo da execução
        if: always()
        run: |
          {
            echo '### Backend — pytest'
            echo '```'
            tail -n 80 pytest.log 2>/dev/null || echo 'Pytest não executado'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: |
            backend/coverage.xml
            backend/pytest.log
          if-no-files-found: warn

  frontend:
    name: Frontend — lint, tipos e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Checagem de tipos
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Build de produção
        run: npm run build

  integration:
    name: Docker Compose — integração das camadas
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: viatura-ci
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuração
        run: docker compose config --quiet
      - name: Construir e iniciar banco, API e frontend
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Verificar API, banco e rotas do frontend
        run: |
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent --show-error http://localhost:8000/viaturas/
          curl --fail --silent --show-error http://localhost:5173/ | grep -q '<div id="root">'
          curl --fail --silent --show-error http://localhost:5173/viaturas | grep -q '<div id="root">'
      - name: Logs da integração
        if: failure()
        run: docker compose logs --no-color
      - name: Encerrar ambiente descartável
        if: always()
        run: docker compose down --volumes --remove-orphans
